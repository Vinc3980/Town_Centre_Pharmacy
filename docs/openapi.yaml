        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  example: OldPass123!
                newPassword:
                  type: string
                  minLength: 6
                  example: NewPass456!
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Password changed successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

# ═══════════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════════
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token obtained from POST /auth/login"

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: User ID
    MedicineId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Medicine ID
    SaleId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Sale ID
    DateFrom:
      name: from
      in: query
      schema:
        type: string
        format: date
      description: Start date (ISO 8601)
    DateTo:
      name: to
      in: query
      schema:
        type: string
        format: date
      description: End date (ISO 8601)
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
      description: Items per page

  schemas:
    # ── Auth ──
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: owner@adompharmacy.gh
        password:
          type: string
          example: Owner123!

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIs...
            refreshToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIs...
            user:
              $ref: "#/components/schemas/UserProfile"

    # ── User ──
    User:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          example: Nana Adjei (Owner)
        email:
          type: string
          example: owner@adompharmacy.gh
        phone:
          type: string
          example: "+233241234567"
        role:
