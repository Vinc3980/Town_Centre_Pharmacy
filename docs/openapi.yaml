openapi: 3.0.3
info:
  title: Adom Pharmacy Management System API
  description: |
    Production-grade pharmacy management platform supporting multi-branch operations,
    inventory (FEFO), POS, prescriptions, and analytics.

    **Authentication:** All protected endpoints require a Bearer JWT token in the
    `Authorization` header.

    **Currency:** All monetary values are in Ghana Cedis (GHS).

    **Rate Limiting:** Login endpoint is rate-limited to 20 requests per 15 minutes per IP.
  version: 1.0.0
  contact:
    name: Adom Pharmacy Support
    email: support@adompharmacy.gh
  license:
    name: Private
    url: https://adompharmacy.gh/license

servers:
  - url: http://localhost:5000/api/v1
    description: Development
  - url: https://api.adompharmacy.com/api/v1
    description: Production

tags:
  - name: Auth
    description: Authentication and session management
  - name: Users
    description: Staff user administration
  - name: Medicines
    description: Medicine catalogue and stock management
  - name: Sales
    description: Point-of-sale transactions, held sales, and refunds
  - name: Customers
    description: Customer records
  - name: Expenses
    description: Expense tracking and approval
  - name: Daily
    description: Daily cash sessions and end-of-day reports
  - name: Reports
    description: Analytics and report generation (CSV, Excel, PDF export)
  - name: Dashboard
    description: Dashboard summaries and charts
  - name: Notifications
    description: In-app notifications
  - name: Settings
    description: Pharmacy, inventory, sales, and security settings
  - name: Audit
    description: Audit trail logs
  - name: Profile
    description: Current user profile management
  - name: Health
    description: API health check

security:
  - BearerAuth: []

paths:
  # ─── Health ────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: API health check
      description: Returns API status, database connectivity, version, and uptime. No authentication required.
      security: []
      operationId: healthCheck
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Auth ──────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      description: |
        Validates credentials and returns access/refresh JWT tokens.
        Accounts are locked after 5 failed attempts for 15 minutes.
        Rate limited to 20 requests per 15 minutes per IP.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          description: Account locked due to too many failed attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Exchange a valid refresh token for a new access token.
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIs...
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user
      description: Invalidates the current refresh token by incrementing the token version.
      operationId: logout
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      description: Returns the profile of the currently authenticated user.
      operationId: getMe
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Users ─────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: List all users
      description: Returns all staff users. Requires `manage_users` permission.
      operationId: listUsers
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Users]
      summary: Create a new user
      description: Creates a new staff account. Requires `manage_users` permission.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Returns a single user. Requires `manage_users` permission.
      operationId: getUserById
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Users]
      summary: Update user
      description: Updates user details. Requires `manage_users` permission. Cannot change the owner's role.
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/deactivate:
    post:
      tags: [Users]
      summary: Deactivate user
      description: Disables a user account. Cannot deactivate the owner or yourself.
      operationId: deactivateUser
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User deactivated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/reactivate:
    post:
      tags: [Users]
      summary: Reactivate user
      description: Re-enables a previously deactivated user account.
      operationId: reactivateUser
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User reactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User reactivated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Medicines ─────────────────────────────────────────
  /medicines:
    get:
      tags: [Medicines]
      summary: List all medicines
      description: Returns medicines with current stock levels. Supports search and filtering.
      operationId: listMedicines
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by medicine name
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category ID
        - name: status
          in: query
          schema:
            type: string
            enum: [active, discontinued]
          description: Filter by status
      responses:
        "200":
          description: List of medicines with stock info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MedicineWithStock"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Medicines]
      summary: Create a new medicine
      description: Adds a new medicine to the catalogue. Requires `manage_medicines` permission.
      operationId: createMedicine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMedicineRequest"
      responses:
        "201":
          description: Medicine created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Medicine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /medicines/barcode/{barcode}:
    get:
      tags: [Medicines]
      summary: Lookup medicine by barcode
      description: Returns medicine details and stock for a given barcode.
      operationId: lookupBarcode
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
          example: "890123001001"
      responses:
        "200":
          description: Medicine found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/MedicineWithStock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /medicines/{id}:
    put:
      tags: [Medicines]
      summary: Update medicine
      description: Updates medicine details. Requires `manage_medicines` permission.
      operationId: updateMedicine
      parameters:
        - $ref: "#/components/parameters/MedicineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMedicineRequest"
      responses:
        "200":
          description: Medicine updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Medicine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Medicines]
      summary: Delete medicine
      description: Permanently removes a medicine. Requires `manage_medicines` permission.
      operationId: deleteMedicine
      parameters:
        - $ref: "#/components/parameters/MedicineId"
      responses:
        "200":
          description: Medicine deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Medicine deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /medicines/{id}/discontinue:
    post:
      tags: [Medicines]
      summary: Discontinue medicine
      description: Marks a medicine as discontinued. It can no longer be sold. Requires `manage_medicines` permission.
      operationId: discontinueMedicine
      parameters:
        - $ref: "#/components/parameters/MedicineId"
      responses:
        "200":
          description: Medicine discontinued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Medicine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /medicines/stock/receive:
    post:
      tags: [Medicines]
      summary: Receive stock (new batch)
      description: |
        Creates a new batch for a medicine and records the inventory movement.
        Requires `manage_inventory` permission. Triggers low-stock and expiry notifications.
      operationId: receiveStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveStockRequest"
      responses:
        "201":
          description: Batch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/MedicineBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /medicines/stock/adjust:
    post:
      tags: [Medicines]
      summary: Adjust stock quantity
      description: Adjusts a batch's stock level by a positive or negative amount. Requires `perform_stock_adjustment` permission.
      operationId: adjustStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustStockRequest"
      responses:
        "200":
          description: Stock adjusted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/MedicineBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /medicines/reports/low-stock:
    get:
      tags: [Medicines]
      summary: Low stock report
      description: Returns active medicines whose total stock is at or below the reorder level. Requires `view_reports` permission.
      operationId: medicineLowStockReport
      responses:
        "200":
          description: Low stock items
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        medicine:
                          $ref: "#/components/schemas/Medicine"
                        totalStock:
                          type: integer
                          example: 8
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /medicines/reports/expiry:
    get:
      tags: [Medicines]
      summary: Expiry report
      description: Returns batches expiring within the given number of days. Requires `view_reports` permission.
      operationId: medicineExpiryReport
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
          description: Number of days to check for expiry
      responses:
        "200":
          description: Expiring batches
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MedicineBatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ─── Sales ─────────────────────────────────────────────
  /sales:
    get:
      tags: [Sales]
      summary: List sales
      description: Returns sales with optional date, cashier, status, and search filters. Requires `view_reports` permission.
      operationId: listSales
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Start date (ISO 8601)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: End date (ISO 8601)
        - name: cashier
          in: query
          schema:
            type: string
          description: Filter by cashier user ID
        - name: status
          in: query
          schema:
            type: string
            enum: [completed, partially_refunded, refunded, voided, held]
        - name: search
          in: query
          schema:
            type: string
          description: Search by transaction number
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Sales]
      summary: Create a sale (POS checkout)
      description: |
        Processes a complete sale. Deducts inventory using FEFO (First Expiry, First Out),
        records payments, and emits real-time events. Requires `process_sales` permission.
      operationId: createSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaleRequest"
      responses:
        "201":
          description: Sale completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /sales/held:
    get:
      tags: [Sales]
      summary: List held sales
      description: Returns all sales with status "held" (parked transactions). Requires `process_sales` permission.
      operationId: listHeldSales
      responses:
        "200":
          description: List of held sales
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sales/refunds/pending:
    get:
      tags: [Sales]
      summary: List pending refund requests
      description: Returns refund requests awaiting manager approval. Requires `process_refunds` permission.
      operationId: listPendingRefunds
      responses:
        "200":
          description: Pending refunds
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SaleReturn"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sales/{id}:
    get:
      tags: [Sales]
      summary: Get sale detail
      description: Returns full sale details including linked return records. Requires `view_reports` permission.
      operationId: getSaleDetail
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "200":
          description: Sale detail with returns
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sale:
                        $ref: "#/components/schemas/Sale"
                      returns:
                        type: array
                        items:
                          $ref: "#/components/schemas/SaleReturn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /sales/{id}/receipt:
    get:
      tags: [Sales]
      summary: Get sale receipt
      description: Returns formatted receipt data for a sale. Requires `view_reports` permission.
      operationId: getSaleReceipt
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "200":
          description: Receipt data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Receipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /sales/hold:
    post:
      tags: [Sales]
      summary: Hold (park) a sale
      description: Temporarily holds a sale without completing payment. Reserves stock. Requires `process_sales` permission.
      operationId: holdSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldSaleRequest"
      responses:
        "201":
          description: Sale held
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sales/{id}/resume:
    post:
      tags: [Sales]
      summary: Resume a held sale
      description: Completes a previously held sale by processing payment and deducting inventory. Requires `process_sales` permission.
      operationId: resumeSale
      parameters:
        - $ref: "#/components/parameters/SaleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeSaleRequest"
      responses:
        "200":
          description: Sale resumed and completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /sales/{id}/refund:
    post:
      tags: [Sales]
      summary: Request a refund
      description: |
        Creates a return request for items in a sale. If manager approval is required,
        the refund is queued as "pending". Requires `process_refunds` permission.
      operationId: requestRefund
      parameters:
        - $ref: "#/components/parameters/SaleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
      responses:
        "201":
          description: Refund request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/SaleReturn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sales/{id}/void:
    post:
      tags: [Sales]
      summary: Void a sale
      description: |
        Cancels a sale and restores inventory. Cannot void already refunded or voided sales.
        Requires `process_refunds` permission.
      operationId: voidSale
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "200":
          description: Sale voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /sales/refunds/{returnId}/approve:
    post:
      tags: [Sales]
      summary: Approve or reject a refund
      description: |
        Approves a pending refund (restores stock for resaleable items) or rejects it
        with a reason. Requires `process_refunds` permission.
      operationId: approveRefund
      parameters:
        - name: returnId
          in: path
          required: true
          schema:
            type: string
          description: SaleReturn ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rejectionReason:
                  type: string
                  description: If provided, the refund is rejected with this reason
                  example: Item opened and cannot be resold
      responses:
        "200":
          description: Refund approved or rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/SaleReturn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /sales/{id}/held:
    delete:
      tags: [Sales]
      summary: Delete a held sale
      description: Permanently removes a held (parked) sale. Requires `process_sales` permission.
      operationId: deleteHeldSale
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "200":
          description: Held sale deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Held sale deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customers ─────────────────────────────────────────
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      description: Returns customers, optionally filtered by search term (name or phone).
      operationId: listCustomers
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or phone number
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Customers]
      summary: Create customer
      description: Adds a new customer record. Requires `process_sales` permission.
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /customers/{id}:
    put:
      tags: [Customers]
      summary: Update customer
      description: Updates a customer's details. Requires `process_sales` permission.
      operationId: updateCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Customer ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Ama Owusu
                phone:
                  type: string
                  example: "0241234567"
                notes:
                  type: string
                  example: Prefers SMS notifications
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Expenses ──────────────────────────────────────────
  /expenses:
    get:
      tags: [Expenses]
      summary: List expenses
      description: Returns expenses with optional filters. Requires `manage_expenses` permission.
      operationId: listExpenses
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: category
          in: query
          schema:
            type: string
            enum: [rent, utilities, salaries, transport, supplier_payment, maintenance, marketing, insurance, taxes, misc]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          schema:
            type: string
          description: Search by description
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Expenses]
      summary: Create expense
      description: Records a new expense. Supports `multipart/form-data` with optional receipt file. Requires `manage_expenses` permission.
      operationId: createExpense
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, description, amount]
              properties:
                category:
                  type: string
                  enum: [rent, utilities, salaries, transport, supplier_payment, maintenance, marketing, insurance, taxes, misc]
                  example: utilities
                description:
                  type: string
                  example: Monthly electricity bill
                amount:
                  type: number
                  format: float
                  example: 850.00
                paymentMethod:
                  type: string
                  enum: [cash, mobile_money, card, bank_transfer, other]
                  example: mobile_money
                date:
                  type: string
                  format: date
                  example: "2026-09-01"
                receipt:
                  type: string
                  format: binary
                  description: Optional receipt image/PDF
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /expenses/{id}:
    get:
      tags: [Expenses]
      summary: Get expense by ID
      description: Returns full expense details. Requires `manage_expenses` permission.
      operationId: getExpenseById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Expense detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Expenses]
      summary: Update expense
      description: Updates a pending expense. Requires `manage_expenses` permission.
      operationId: updateExpense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                category:
                  type: string
                  enum: [rent, utilities, salaries, transport, supplier_payment, maintenance, marketing, insurance, taxes, misc]
                description:
                  type: string
                amount:
                  type: number
                  format: float
                paymentMethod:
                  type: string
                  enum: [cash, mobile_money, card, bank_transfer, other]
                date:
                  type: string
                  format: date
                receipt:
                  type: string
                  format: binary
      responses:
        "200":
          description: Expense updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /expenses/{id}/approve:
    post:
      tags: [Expenses]
      summary: Approve or reject expense
      description: Approves a pending expense or rejects it with a reason. Requires `manage_expenses` permission.
      operationId: approveExpense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rejectionReason:
                  type: string
                  description: If provided, the expense is rejected
                  example: Receipt not attached
      responses:
        "200":
          description: Expense approved or rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Daily ─────────────────────────────────────────────
  /daily/sessions:
    post:
      tags: [Daily]
      summary: Open daily cash session
      description: Opens a new cash session with an opening float. Only one open session per user. Requires `process_sales` permission.
      operationId: openSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openingCash]
              properties:
                openingCash:
                  type: number
                  format: float
                  description: Opening cash float in GHS
                  example: 500.00
      responses:
        "201":
          description: Session opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/DailySession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      tags: [Daily]
      summary: List daily sessions
      description: |
        Returns sessions. Managers see all sessions; staff see only their own.
        Requires `view_reports` permission.
      operationId: listSessions
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed]
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DailySession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /daily/sessions/close:
    post:
      tags: [Daily]
      summary: Close daily cash session
      description: Closes the current open session and computes cash variance. Requires `process_sales` permission.
      operationId: closeSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actualCash]
              properties:
                actualCash:
                  type: number
                  format: float
                  description: Actual cash counted in drawer (GHS)
                  example: 1243.50
                notes:
                  type: string
                  example: Variance due to overpayment
      responses:
        "200":
          description: Session closed with aggregates
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/DailySession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /daily/sessions/current:
    get:
      tags: [Daily]
      summary: Get current open session
      description: Returns the authenticated user's currently open cash session, if any. Requires `process_sales` permission.
      operationId: getCurrentSession
      responses:
        "200":
          description: Current session or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/DailySession"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /daily/reports/submit:
    post:
      tags: [Daily]
      summary: Submit daily report
      description: Submits an end-of-day report for the most recently closed session. Requires `process_sales` permission.
      operationId: submitReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actualCash]
              properties:
                actualCash:
                  type: number
                  format: float
                  example: 1243.50
                notes:
                  type: string
                  example: All figures verified
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/DailyReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /daily/reports/pending:
    get:
      tags: [Daily]
      summary: List pending daily reports
      description: Returns reports with status "submitted" or "draft". Requires `view_reports` permission.
      operationId: listPendingReports
      responses:
        "200":
          description: Pending reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DailyReport"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /daily/reports:
    get:
      tags: [Daily]
      summary: List all daily reports
      description: Returns all reports. Managers see all; staff see their own. Requires `view_reports` permission.
      operationId: listAllReports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, approved, rejected]
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DailyReport"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /daily/reports/{id}:
    get:
      tags: [Daily]
      summary: Get daily report detail
      description: Returns a single report with user and session populated. Requires `view_reports` permission.
      operationId: getReportById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/DailyReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /daily/reports/{id}/approve:
    post:
      tags: [Daily]
      summary: Approve daily report
      description: Approves a submitted report. Only owner and branch_manager can approve. Requires `view_reports` permission.
      operationId: approveReport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewNotes:
                  type: string
                  example: Figures look correct
      responses:
        "200":
          description: Report approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/DailyReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /daily/reports/{id}/reject:
    post:
      tags: [Daily]
      summary: Reject daily report
      description: Rejects a submitted report with a required reason. Only owner and branch_manager can reject. Requires `view_reports` permission.
      operationId: rejectReport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewNotes]
              properties:
                reviewNotes:
                  type: string
                  example: Cash variance too high, please recount
      responses:
        "200":
          description: Report rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/DailyReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Reports ───────────────────────────────────────────
  /reports/sales:
    get:
      tags: [Reports]
      summary: Sales report
      description: Returns paginated sales data with summary (revenue, cost, profit, discount, tax). Supports CSV, Excel, PDF export. Requires `view_reports` permission.
      operationId: salesReport
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: cashier
          in: query
          schema:
            type: string
        - name: paymentMethod
          in: query
          schema:
            type: string
            enum: [cash, mobile_money, card, bank_transfer, other]
        - name: status
          in: query
          schema:
            type: string
        - name: branch
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
          description: Export format (default: json)
      responses:
        "200":
          description: Sales report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reports/inventory:
    get:
      tags: [Reports]
      summary: Inventory report
      description: Returns batch-level inventory with stock values. Requires `view_reports` permission.
      operationId: inventoryReport
      parameters:
        - name: medicine
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
      responses:
        "200":
          description: Inventory report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"

  /reports/expenses:
    get:
      tags: [Reports]
      summary: Expense report
      description: Returns expenses with totals. Requires `view_reports` permission.
      operationId: expenseReport
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: paymentMethod
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
      responses:
        "200":
          description: Expense report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"

  /reports/profit:
    get:
      tags: [Reports]
      summary: Profit report
      description: Returns daily profit breakdown (revenue, COGS, gross profit, expenses, net profit). Requires `view_reports` permission.
      operationId: profitReport
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: branch
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
      responses:
        "200":
          description: Profit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"

  /reports/staff:
    get:
      tags: [Reports]
      summary: Staff performance report
      description: Returns per-staff metrics (sales, profit, transactions, sessions, reports). Requires `view_reports` permission.
      operationId: staffReport
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
      responses:
        "200":
          description: Staff report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"

  /reports/stock-movements:
    get:
      tags: [Reports]
      summary: Stock movement report
      description: Returns inventory movement history (receive, sale, adjustment, return, damaged, expired). Requires `view_reports` permission.
      operationId: stockMovementReport
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: medicine
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
      responses:
        "200":
          description: Stock movement report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"

  /reports/expiry:
    get:
      tags: [Reports]
      summary: Expiry report
      description: Returns batches expiring within the configured number of days. Requires `view_reports` permission.
      operationId: expiryReport
      parameters:
        - name: expiryDays
          in: query
          schema:
            type: integer
            default: 90
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
      responses:
        "200":
          description: Expiry report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"

  /reports/low-stock:
    get:
      tags: [Reports]
      summary: Low stock report
      description: Returns medicines at or below reorder level. Requires `view_reports` permission.
      operationId: lowStockReport
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, xlsx, pdf]
      responses:
        "200":
          description: Low stock report
          content:
