# Render Blueprint — https://render.com/docs/blueprint-spec
# Activate via Dashboard → New → Blueprint → connect the repo; Render
# creates the database, sets secrets, and runs migrate + seed on deploy.
services:
  - type: web
    name: town-centre-pharmacy
    runtime: node
    plan: free
    buildCommand: >-
      cd backend && npm ci && npx prisma generate && cd ../frontend && npm ci && cd .. && npm run build
    startCommand: npm start
    preDeployCommand: cd backend && npx prisma migrate deploy && node prisma/seed.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: town-centre-pharmacy-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

databases:
  - name: town-centre-pharmacy-db
    plan: free
    databaseName: adom_pharmacy
    user: adom_app
